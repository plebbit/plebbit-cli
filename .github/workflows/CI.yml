# CI for the src folder
name: CI

on:
  pull_request:
    branches:
      - master
      - next
    paths:
      - 'test/**'
      - 'src/**'
      - 'config/**'
      - 'ci-bin/**'
      - 'ci-bin/*'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
  push:
    branches:
      - master
      - next
    paths:
      - 'test/**'
      - 'src/**'
      - 'config/**'
      - 'ci-bin/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'

jobs:
  test-bitsocial-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'
      - run: corepack enable npm && corepack prepare npm@11.13.0 --activate
        shell: bash

      - name: Smoke test Docker deps stage
        if: matrix.os == 'ubuntu-latest'
        run: docker build --target deps -t bitsocial-cli:deps-smoke .

      # Retry: the kubo postinstall downloads its binary from GitHub releases
      # (kubo >= 0.43.0; it used dist.ipfs.tech before, which went down for good
      # in 2026-10). A transient download failure aborts the install with no retry
      # of its own (issue #110). This affects every install step, not just the
      # global install below.
      - name: npm ci (with retry)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            echo "npm ci attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          exit 1
      - run: npm run build
      - run: npx oclif manifest

      # Windows defaults the npm global prefix to C:\npm\prefix, on the OS
      # volume. Installing this package's ~1386 dependencies there took ~9m,
      # while `npm ci` writes a larger tree (2054 packages) to the workspace on
      # D:, the runner's fast volume, in ~55s. That gap repeatedly pushed the
      # job past timeout-minutes, and a cancelled CI run on master silently
      # skips CI-build.yml, so no release is published (issue #136).
      #
      # Measured on windows-latest, same warm cache, only the destination
      # differing: C: 9.1m, D: 1.4m, and a plain non-global install on D: 1.0m.
      # Resolution (12s), postinstall scripts, npm version and the network were
      # each ruled out first - `--offline` succeeds in ~10m, so none of the cost
      # was registry traffic.
      #
      # setup-node exports npm_config_prefix, which takes precedence over
      # `npm config set prefix`, so the env var itself has to be overridden.
      - name: Put the npm global prefix on the fast volume (windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p /d/npm-global
          echo 'npm_config_prefix=D:\npm-global' >> $GITHUB_ENV
          echo 'D:\npm-global' >> $GITHUB_PATH

      - name: Verify global install from pack
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "npm global prefix: $(npm config get prefix)"
          TARBALL=$(npm pack | tail -1)
          # Retry: the kubo postinstall downloads its binary from GitHub releases;
          # a transient download failure aborts the install with no retry of its
          # own (issue #110).
          # --prefer-offline reuses the cache primed by `npm ci` above. Note it
          # is not what makes this step fast - see #136; the destination volume
          # is. Kept because reusing the cache is still the right default.
          for attempt in 1 2 3; do
            npm install -g --prefer-offline --no-audit --no-fund "./$TARBALL" && break
            echo "global install attempt $attempt failed; retrying in 15s..."
            sleep 15
          done
          bitsocial --version

      # disable hosts we shouldn't use (Linux only)
      - name: Block unwanted hosts
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo echo "255.255.255.255 cloudflare-ipfs.com" | sudo tee -a /etc/hosts
          sudo echo "255.255.255.255 pubsubprovider.xyz" | sudo tee -a /etc/hosts

      - run: DEBUG="bitsocial*, plebbit*, oclif*" npm run test:cli
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
